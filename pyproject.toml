[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "identitymesh"
version = "0.0.1"
description = "Identity security for humans, cloud workloads, and autonomous AI agents."
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.31,<1",
    "fastapi>=0.115,<1",
    "neo4j>=6.3,<7",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
identitymesh-api = "identitymesh.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
identitymesh = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["identitymesh"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["identitymesh"]
